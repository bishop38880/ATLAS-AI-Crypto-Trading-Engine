[project]
name = "mev-researcher-mcp"
version = "0.1.0"
description = "Mempool Surveillance & MEV Researcher MCP — Section 25.5 Architecture"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "httpx[http2]",
    "msgspec",
    "pydantic>=2.0",
    "python-dotenv",
    "loguru",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pyright",
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
