repos:
-   repo: local
    hooks:
    -   id: check-invariants
        name: Sentinel Audit Invariant Checker
        entry: ./scripts/check_invariants.py
        language: python
        types: [python]
        files: ^(atlas|prometheus)/.*\.py$
        pass_filenames: true

-   repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
    -   id: black

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort

-   repo: local
    hooks:
    -   id: pytest
        name: pytest
        entry: pytest
        language: system
        types: [python]
        pass_filenames: false
